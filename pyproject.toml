[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coordkit"
version = "0.4.0"
description = "Agent-native local message bus for agent swarms"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["agents", "coordination", "message-bus", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Git-on-my-level/coordkit"
Repository = "https://github.com/Git-on-my-level/coordkit"
Issues = "https://github.com/Git-on-my-level/coordkit/issues"

[project.scripts]
coordkit = "coordkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
