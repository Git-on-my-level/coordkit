# Keep this manifest in coordkit throughout shadow and cutover. Root stays local.
mode = "shadow"
[project]
name = "example"
git_repo = "example/project"
[anx]
workspace = "example"
board = "ck-example"
[paths]
root = ".coordkit"
bus_log = "/path/to/project/data/run-example/swarm/bus.jsonl"
machine_state = "/path/to/project/data/run-example/swarm/state"
events = "/path/to/scratch/lead-wait/events.ndjson"
[agentctl.pools]
implement = "pool:implement"
review = "pool:review"
plan = "pool:plan"
[lane]
initiative = "example"
# Example run limit; adjust for the workload.
max_run_hours = 24
[loop.loops.audit]
[escalation]
card = "card:loop-audit"
internal_to = "maintainer"
internal_senders = ["maintainer"]
[reconciler]
shared_git_dirs = ["/path/to/project/shared.git"]
[wait]
debounce = 300
[launchd]
label_prefix = "com.example.project"
path = ["/path/to/bin", "/opt/homebrew/bin", "/usr/local/bin", "/usr/bin", "/bin"]
python = "/path/to/bin/python3.11"
[shadow]
incumbent_bus_source = "/path/to/project/data/run-example/swarm/bin/bus"
incumbent_merge_source = "/path/to/scratch/worktrees/sample-rollout-tools/infra/rollout/bin/merge_on_green.py"
lane_records = "/path/to/scratch/example-runs/req"
max_gap_seconds = 600
[obligations]
coordinator = "coordinator"
# Coordinator owns auditor flags; 2h alerts reach it via the relay.
flag_owner = "coordinator"
flag_sources = ["audit-legacy"]
[addressed]
# Example addressed role and lane roster; customize before use.
# A lane works 5-30 min after its waiter delivers; 3m made every busy lane read as deaf.
rearm_grace = "20m"
# Example policy: no escalation wakes the lead; they batch into one digest an hour.
lead_escalations = false
# Pre-cutover (shadow): the sweep reads the live bus, counts incumbent `bus wait --to NAME`
# processes as listening, and writes only coordkit-local state plus the relay file below.
incumbent_waiters = true
relay = "relay"
relay_file = ".coordkit/pending-alerts.ndjson"
[addressed.roles]
coordinator = ["coordinator", "lead-example"]
lead = ["lead-example", "coordinator"]
[addressed.agents.coordinator]
runtime = "claude-code"
fallback = "lead"
[addressed.agents.lead-example]
runtime = "claude-code"
fallback = "coordinator"
[addressed.agents.relay]
runtime = "claude-code"
fallback = "coordinator"
[addressed.agents.worker-a]
runtime = "claude-code"
fallback = "coordinator"
[addressed.agents.worker-b]
runtime = "claude-code"
fallback = "coordinator"
[addressed.agents.worker-c]
runtime = "claude-code"
fallback = "coordinator"
[addressed.agents.worker-d]
runtime = "claude-code"
fallback = "coordinator"
[addressed.agents.worker-e]
runtime = "claude-code"
fallback = "coordinator"
[addressed.agents.worker-f]
runtime = "claude-code"
fallback = "coordinator"
[addressed.agents.worker-g]
runtime = "claude-code"
fallback = "coordinator"
[addressed.agents.maintainer]
runtime = "claude-code"
fallback = "coordinator"
[review]
family = "ledger"
# Example review ledger: `coordkit review record` writes here at cutover; read-only in shadow.
ledger = "/path/to/project/data/run-example/swarm/state/review-ledger.jsonl"
# [merge].require_review_ship stays false until the operator rules on required review (deployment review policy).
result_globs = ["/path/to/scratch/example-runs/review-*.md", "/path/to/scratch/*-handoff/**/rresult*.out"]

# Optional usage observation metadata; add one record per independently scoped lane.
# Shared account/cwd pairs are ambiguous. This does not affect launching or waiting.
# [[lanes]]
# name = "worker"
# config_dir = "/path/to/claude-secondary"
# cwd = "/absolute/path/to/worktree"
# model = "FAMILY_OR_EXACT_TRANSCRIPT_MODEL"
# effort = "high"
# [wait] already exists above; optional policy defaults are min_timeout_minutes = 0, backoff = 1.

[questions]
config_dirs = ["/path/to/claude-primary", "/path/to/claude-secondary", "/path/to/claude-tertiary"]
# Illustrative approval topics; customize for your project.
guarded_patterns = ['\bdeploy\b', '\bdelete\b', '\bcredentials?\b']
fallback_role = "coordinator"
human_actor = "operator"

[mcp]
identity = "example-mcp"
train_pattern = '\btrain-\d+\b'
train_state_dir = "/path/to/scratch/train/state"
ref_roots = ["/path/to/project/data/run-example/swarm/state/refs", ".coordkit/state/refs", "/path/to/project/data/run-example"]
