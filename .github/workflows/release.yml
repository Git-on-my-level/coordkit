name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag and source tree
        env:
          PYTHONPATH: src
          COORDKIT_COLD_CLI_BUDGET: "1.0"
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os; from coordkit import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__, "tag/version mismatch"'
          bash scripts/leak-check.sh
          python -m compileall -q src tests
          python -m unittest discover
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Smoke install wheel and sdist outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          wheel-smoke/bin/coordkit --version
          sdist-smoke/bin/coordkit --version
          wheel-smoke/bin/python -I -c 'from coordkit import __version__; from coordkit.paths import install_root; assert __version__ == "0.1.0"; assert install_root() is None'
          sdist-smoke/bin/python -I -c 'from coordkit import __version__; assert __version__ == "0.1.0"'
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.whl > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
